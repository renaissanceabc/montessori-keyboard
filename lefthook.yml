# Git hooks. `bun install` installs them (the root package.json's prepare script).
# Skip once with `git commit --no-verify` or `LEFTHOOK=0`.

pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
      run: bunx oxlint --deny-warnings {staged_files}
    - name: format
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,mts,cts,json,jsonc,css,md,yml,yaml}"
      exclude:
        - "bun.lock"
        - "**/*.xcassets/**"
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # Swift tools come from Xcode (swift-format) and mise (swiftlint), so a machine without them
    # skips this and CI's iOS job catches it.
    - name: swift-format
      glob: "apps/ios/**/*.swift"
      run: |
        if xcrun --find swift-format >/dev/null 2>&1; then
          xcrun swift-format format --in-place --configuration apps/ios/.swift-format {staged_files}
        else
          echo "swift-format not found: skipping"
        fi
      stage_fixed: true
    - name: swiftlint
      glob: "apps/ios/**/*.swift"
      run: |
        if command -v swiftlint >/dev/null 2>&1; then
          swiftlint lint --strict --quiet --config apps/ios/.swiftlint.yml {staged_files}
        else
          echo "swiftlint not found: skipping"
        fi

pre-push:
  parallel: true
  jobs:
    - name: lint
      run: bun run lint
    - name: format
      run: bun run format:check
    - name: typecheck
      run: bun run typecheck
    - name: test
      run: bun run test

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
