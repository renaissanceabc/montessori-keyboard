name: iOS

# Builds the app and the keyboard for the simulator and runs the core unit tests.
# Unsigned: nothing here archives or uploads.
# macOS minutes cost 10x Linux ones on a private repo, so this only runs when the iOS app or
# this file changes, skips drafts, and a new push to a pull request cancels the run before it.
on:
  push:
    branches: [main, develop]
    paths: ["apps/ios/**", "mise.toml", ".github/workflows/ios.yml"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["apps/ios/**", "mise.toml", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every commit on develop and main finishes; a pull request only needs its newest one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  XCODE_VERSION: "26.6"

jobs:
  ios-build:
    name: iOS Build And Test
    if: github.event.pull_request.draft != true
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      # Installs the Tuist pinned in mise.toml and caches it between runs.
      - uses: jdx/mise-action@v2
        with:
          install_args: tuist
          cache: true

      # The precompiled SDK and framework modules: the slow part of a cold build that
      # doesn't depend on our sources. Keyed on Xcode, so a new Xcode starts fresh.
      - name: Cache module cache
        uses: actions/cache@v4
        with:
          path: apps/ios/build/ModuleCache.noindex
          key: ios-modules-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-${{ hashFiles('apps/ios/Project.swift') }}
          restore-keys: ios-modules-${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-

      - name: Generate project
        run: tuist generate --no-open

      - name: Pick a simulator
        id: sim
        run: |
          id="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if "iOS" in k), reverse=True)
          for runtime in ios:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')"
          echo "Using simulator $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          status=0
          xcodebuild test \
            -workspace MontessoriKeyboard.xcworkspace \
            -scheme MontessoriKeyboard \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || status=$?
          grep -E "error:|Test (Suite|Case|run)|✔|✘|\*\* (TEST|BUILD)" "$RUNNER_TEMP/xcodebuild.log" | tail -200 || true
          exit $status

      # Debug builds open one screen from `-screen <name>` (DebugScreens.swift), so each shot is one launch.
      # Shots are evidence for a pull request, so a push to develop or main skips them.
      - name: Screenshots
        if: github.event_name != 'push'
        env:
          SIM: ${{ steps.sim.outputs.id }}
        run: |
          app="$(find build/Build/Products -name 'MontessoriKeyboard.app' -path '*iphonesimulator*' | head -1)"
          xcrun simctl boot "$SIM" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl status_bar "$SIM" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$SIM" "$app"
          mkdir -p shots
          shoot() {
            xcrun simctl terminate "$SIM" com.renaissance.montessorikeyboard 2>/dev/null || true
            xcrun simctl launch "$SIM" com.renaissance.montessorikeyboard -screen "$2" -padText "${3:-}" > /dev/null
            sleep 4
            xcrun simctl io "$SIM" screenshot "shots/$1-$2.png"
          }
          for look in light dark; do
            xcrun simctl ui "$SIM" appearance "$look"
            for screen in welcome setup choose tryit gate settings strip numbers guide about; do shoot "$look" "$screen"; done
            shoot "$look" pad "The cat sat"
          done
          ls shots

      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'push'
        with:
          name: screenshots
          path: apps/ios/shots
          if-no-files-found: ignore

      - name: Show compile errors
        if: failure()
        run: grep -E "error:" "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -100 || true
