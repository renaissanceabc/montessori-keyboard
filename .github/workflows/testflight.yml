name: TestFlight

# Archives the app and the keyboard, signs them with match, and uploads the build to TestFlight
# for testing on real devices. Manual only: run it from the Actions tab or
# `gh workflow run testflight.yml --ref develop`. Setup: apps/ios/README.md, "TestFlight".
on:
  workflow_dispatch:

# A second run waits for the first. Cancelling mid-upload can leave a half-sent build at App
# Store Connect.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  XCODE_VERSION: "26.6"

jobs:
  testflight:
    name: Upload To TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - uses: jdx/mise-action@v2
        with:
          install_args: tuist
          cache: true

      # Installs the locked fastlane and caches the gems.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/ios

      - name: Archive and upload
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: bundle exec fastlane release

      # Kept a week, so a failed upload can be retried by hand without rebuilding.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa
          path: apps/ios/build/*.ipa
          retention-days: 7
          if-no-files-found: ignore
