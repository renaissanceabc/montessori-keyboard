# SwiftLint for the app, the keyboard and their frameworks. swift-format (.swift-format) owns
# layout, so the rules that only judge whitespace, wrapping and length are off here.
included:
  - Sources
  - Tests
  - Project.swift
  - Tuist.swift
excluded:
  - vendor
  - build
  - Derived

disabled_rules:
  - line_length
  - trailing_comma
  - opening_brace
  - vertical_whitespace
  - trailing_whitespace
  - comma
  - colon
  - statement_position
  - identifier_name
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - nesting
  - todo
  # swift-format decides where a wrapped closure's parameters go.
  - closure_parameter_position
  # SwiftUI's own shape: Button(action:) { label }.
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - empty_count
  - first_where
  - contains_over_first_not_nil
  - last_where
  - sorted_first_last
  - toggle_bool
  - unused_optional_binding
  - redundant_nil_coalescing
  - fatal_error_message
  - weak_delegate

large_tuple:
  warning: 4
